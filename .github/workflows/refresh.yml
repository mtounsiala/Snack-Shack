name: Refresh dashboard

on:
  schedule:
    - cron: "0 * * * *"      # every hour
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Download the workbook from OneDrive
        env:
          SHARE_LINK: ${{ secrets.ONEDRIVE_LINK }}
        run: |
          python - <<'EOF'
          import os, base64, sys, urllib.request, urllib.error
          link = os.environ["SHARE_LINK"].strip()
          print("Secret length:", len(link), "| starts with https://1drv.ms/ :", link.startswith("https://1drv.ms/"), "| has ?e= code:", "e=" in link)
          tok = "u!" + base64.urlsafe_b64encode(link.encode()).decode().rstrip("=")
          sep = "&" if "?" in link else "?"
          attempts = [
              ("A: link + download=1", link + sep + "download=1"),
              ("B: shares API", f"https://api.onedrive.com/v1.0/shares/{tok}/root/content"),
          ]
          for label, url in attempts:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                      ctype = r.headers.get("Content-Type", "")
                      print(label, "-> HTTP", r.status, ctype, len(data), "bytes")
                  if data[:2] == b"PK":
                      open("Financial_Document.xlsx", "wb").write(data)
                      print("Downloaded workbook using", label)
                      sys.exit(0)
                  print(label, "-> got a web page, not an Excel file (link probably needs sign-in)")
              except urllib.error.HTTPError as e:
                  print(label, "-> HTTP error", e.code)
              except Exception as e:
                  print(label, "-> failed:", type(e).__name__)
          sys.exit("Could not download the workbook with any method")
          EOF

      - name: Refresh the dashboard from the workbook
        run: python refresh_dashboard.py Financial_Document.xlsx

      - name: Prepare site
        run: |
          mkdir site
          cp October_Business_Dashboard.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
